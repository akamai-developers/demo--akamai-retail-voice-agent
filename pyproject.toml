[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-voice-reference"
version = "0.5.0"
description = "A local or GPU-hosted retail voice assistant with tenant-scoped shopping tools"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "starlette==1.10.0", "uvicorn==0.34.2", "pillow==13.0.0", "python-multipart==0.0.33", "httpx==0.28.1", "pipecat-ai==1.15.0"]

[project.optional-dependencies]
test = ["httpx==0.28.1", "ruff==0.11.9", "jsonschema==4.23.0", "playwright==1.51.0", "mypy==1.15.0", "setuptools==84.2.1", "wheel==0.48.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_voice = ["web/*", "web/brand/*", "web/fonts/*", "profiles/*.json", "data/*.json", "data/products/*.jpg", "data/demo/*.png", "data/demo/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
