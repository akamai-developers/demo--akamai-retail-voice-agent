name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python scripts/public_check.py --publish
      - run: python scripts/demo.py setup
      - run: .venv/bin/python -m pip check
      - run: PATH="$PWD/.venv/bin:$PATH" make check
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: PATH="$PWD/.venv/bin:$PATH" make test-ui test-tryon-ui test-architecture-ui test-package
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock.txt
      - run: python scripts/audit_gpu.py
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          VERSION: '8.30.1'
        run: |
          curl --fail --location --output gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --location --output checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          expected=$(awk "/gitleaks_${VERSION}_linux_x64.tar.gz/ {print \$1}" checksums.txt)
          test -n "$expected"
          echo "$expected  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner .
